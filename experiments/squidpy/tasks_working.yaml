tasks:
- id: AlinaKurjan-DPhilCode-Python-Ch4_Foetal_SnSpRNAseq-07_Foetal-Spatial-Analysis_NoOuts__interaction_matrix_pair
  train:
    prompt: |
      Using the imc data, tally up, across the whole tissue, how many times a
      cell of each annotated cell type sits as a direct spatial neighbor of a
      cell of a different annotated type, and find which pair of distinct cell
      types has the highest total count of such neighboring events. Report the
      two cell type names.
    answer: apoptotic tumor cell and basal CK tumor cell
  test:
    prompt: |
      Using the slideseqv2 data, tally up, across the whole tissue, how many
      times a cell of each annotated cell type sits as a direct spatial
      neighbor of a cell of a different annotated type, and find which pair of
      distinct cell types has the highest total count of such neighboring
      events. Report the two cell type names.
    answer: CA1_CA2_CA3_Subiculum and DentatePyramids
- id: AlinaKurjan-DPhilCode-Python-Ch4_Foetal_SnSpRNAseq-07_Foetal-Spatial-Analysis_NoOuts__moran_top_gene
  train:
    prompt: |
      Using the visium_hne data, identify the single gene whose expression
      across the tissue is the most spatially structured -- clustered into
      coherent regions rather than scattered at random. Give only the gene
      symbol.
    answer: Nrgn
  test:
    prompt: |
      Using the visium_fluo data, identify the single gene whose expression
      across the tissue is the most spatially structured -- clustered into
      coherent regions rather than scattered at random. Give only the gene
      symbol.
    answer: Ttr
- id: AlinaKurjan-DPhilCode-Python-Ch4_Foetal_SnSpRNAseq-07_Foetal-Spatial-Analysis_NoOuts__nhood_enrichment_pair
  train:
    prompt: |
      Using the visium_hne data, work out which two of the pre-annotated tissue
      clusters sit next to each other in space significantly more often than
      would be expected if their locations were random, i.e. find the single
      strongest pairing of two distinct clusters (a cluster paired with itself
      does not count). Report the two cluster names.
    answer: Hippocampus and Pyramidal_layer
  test:
    prompt: |
      Using the visium_fluo data, work out which two of the pre-annotated tissue
      clusters sit next to each other in space significantly more often than
      would be expected if their locations were random, i.e. find the single
      strongest pairing of two distinct clusters (a cluster paired with itself
      does not count). Report the two cluster names.
    answer: Fiber_tracts and Lateral_ventricle
- id: BKover99-Pseudovisium-Tutorials-CosMx_Tutorial__spatial_gene_top_region
  train:
    prompt: |
      Using the H&E-stained mouse brain Visium data, produce a spatial map of the expression
      of the gene Plp1 across the tissue and use the anatomical region annotation already
      provided with the data to work out which single region has the highest average
      expression of this gene. Report only the name of that region exactly as it is labelled
      in the data.
    answer: Fiber_tract
  test:
    prompt: |
      Using the fluorescence mouse brain Visium data, produce a spatial map of the expression
      of the gene Plp1 across the tissue and use the anatomical region annotation already
      provided with the data to work out which single region has the highest average
      expression of this gene. Report only the name of that region exactly as it is labelled
      in the data.
    answer: Fiber_tracts
- id: BKover99-Pseudovisium-Tutorials-CosMx_Tutorial__spatial_total_counts_max
  train:
    prompt: |
      Using the H&E-stained mouse brain Visium data, work out the total number of transcripts
      detected at each spatial spot and produce a spatial map of this quantity across the
      tissue. Report the single highest total-transcript-count value found at any one spot,
      as a whole number.
    answer: '149086'
  test:
    prompt: |
      Using the fluorescence mouse brain Visium data, work out the total number of transcripts
      detected at each spatial spot and produce a spatial map of this quantity across the
      tissue. Report the single highest total-transcript-count value found at any one spot,
      as a whole number.
    answer: '33997'
- id: BinXBioLab-Data_Science_Capstone_Fall_2022-tangram-scripts-Tangram_CPU__nucleus_region_count
  train:
    prompt: |
      Using the Visium mouse brain fluorescence crop dataset, identify individual cell nuclei
      in the paired tissue image, count how many nuclei fall within each spot, and sum those
      counts by the brain region label already assigned to each spot. Give the exact name of
      the region with the highest total nuclei count.
    answer: Cortex_1
  test:
    prompt: |
      Using the Visium mouse brain H&E-stained crop dataset, identify individual cell nuclei
      in the paired tissue image, count how many nuclei fall within each spot, and sum those
      counts by the brain region label already assigned to each spot. Give the exact name of
      the region with the highest total nuclei count.
    answer: Hippocampus
- id: BioTender-max-awesome-bio-agent-skills-skills-bioskills-imc-pipeline-examples-imc_analysis__spatial_nhood_enrichment
  train:
    prompt: |
      Using the imc data, run a spatial neighborhood enrichment analysis over the
      annotated cell type categories to find which pairs of cell types tend to sit
      next to each other in the tissue more often than would be expected by chance.
      Report the two cell type names that show the strongest such enrichment
      (excluding a cell type paired with itself).
    answer: T cells and endothelial
  test:
    prompt: |
      Using the seqfish data, run a spatial neighborhood enrichment analysis over the
      annotated cell type categories to find which pairs of cell types tend to sit
      next to each other in the tissue more often than would be expected by chance.
      Report the two cell type names that show the strongest such enrichment
      (excluding a cell type paired with itself).
    answer: Intermediate mesoderm and Lateral plate mesoderm
- id: BioTender-max-awesome-bio-agent-skills-skills-bioskills-spatial-analysis-examples-spatial_analysis__imc_co_occurrence
  train:
    prompt: |
      Using the imc data, examine how the probability of finding each annotated cell type
      near another one changes as you look across a range of increasing distances, relative
      to what you'd expect if cell types were randomly distributed in space. Focusing on the
      vimentin-hi stromal cells, report the name of the single other cell type that is most
      enriched in their immediate vicinity, at the shortest distances examined.
    answer: endothelial
  test:
    prompt: |
      Using the imc data, examine how the probability of finding each annotated cell type
      near another one changes as you look across a range of increasing distances, relative
      to what you'd expect if cell types were randomly distributed in space. Focusing on the
      CK+ HR+ tumor cells, report the name of the single other cell type that is most
      enriched in their immediate vicinity, at the shortest distances examined.
    answer: small elongated stromal cell
- id: BioTender-max-awesome-bio-agent-skills-skills-bioskills-spatial-analysis-examples-spatial_analysis__imc_nhood_enrichment
  train:
    prompt: |
      Using the imc data, connect each cell to its nearby neighbors in the tissue to form
      a spatial graph, then test which pairs of the annotated cell types sit next to each
      other in that graph significantly more often than random chance would predict.
      Focusing on the T cells, report the name of the single other cell type whose spatial
      neighboring with T cells shows the strongest such enrichment.
    answer: endothelial
  test:
    prompt: |
      Using the imc data, connect each cell to its nearby neighbors in the tissue to form
      a spatial graph, then test which pairs of the annotated cell types sit next to each
      other in that graph significantly more often than random chance would predict.
      Focusing on the proliferative tumor cells, report the name of the single other cell
      type whose spatial neighboring with them shows the strongest such enrichment.
    answer: p53+ EGFR+ tumor cell
- id: BioTender-max-awesome-bio-agent-skills-skills-bioskills-spatial-analysis-examples-spatial_analysis__imc_spatial_graph_edges
  train:
    prompt: |
      Using the imc data, connect the cells into a spatial network by computing a Delaunay
      triangulation over their tissue coordinates. Report the total number of directed
      connections in the resulting network, counting a connection from cell A to cell B
      separately from the connection from B to A.
    answer: '27954'
  test:
    prompt: |
      Using the seqfish data, connect the cells into a spatial network by computing a
      Delaunay triangulation over their tissue coordinates. Report the total number of
      directed connections in the resulting network, counting a connection from cell A to
      cell B separately from the connection from B to A.
    answer: '116432'
- id: BioTender-max-awesome-bio-agent-skills-skills-bioskills-spatial-pipeline-examples-visium_workflow__hippocampus_proximity
  train:
    prompt: |
      Using the visium_hne data, among all the other pre-annotated anatomical regions, find the one
      that shows the strongest tendency to be located in the immediate spatial vicinity of the
      Hippocampus region, more so than any other single region. Report just that region's name.
    answer: Pyramidal_layer
  test:
    prompt: |
      Using the visium_fluo data, among all the other pre-annotated anatomical regions, find the one
      that shows the strongest tendency to be located in the immediate spatial vicinity of the
      Hippocampus region, more so than any other single region. Report just that region's name.
    answer: Dentate_gyrus
- id: BioTender-max-awesome-bio-agent-skills-skills-bioskills-spatial-pipeline-examples-visium_workflow__nhood_enrichment_pair
  train:
    prompt: |
      Using the visium_hne data, look at the pre-annotated anatomical regions and work out which
      two distinct regions have the strongest tendency to sit right next to each other in space,
      more so than any other pair of different regions. Report the two region names.
    answer: Cortex_4 and Cortex_5
  test:
    prompt: |
      Using the visium_fluo data, look at the pre-annotated anatomical regions and work out which
      two distinct regions have the strongest tendency to sit right next to each other in space,
      more so than any other pair of different regions. Report the two region names.
    answer: Fiber_tracts and Lateral_ventricle
- id: BioTender-max-awesome-bio-agent-skills-skills-bioskills-spatial-pipeline-examples-visium_workflow__top_svg_gene
  train:
    prompt: |
      Using the visium_hne data, identify the single gene whose expression is the most spatially
      variable (structured) across the tissue, based on spatial autocorrelation. Report the gene
      symbol.
    answer: Nrgn
  test:
    prompt: |
      Using the visium_fluo data, identify the single gene whose expression is the most spatially
      variable (structured) across the tissue, based on spatial autocorrelation. Report the gene
      symbol.
    answer: Ttr
- id: DylanMannKrzisnik-BAKLAVAS-scripts-Tangram_SEA_AD__nuclei_segmentation_count
  train:
    prompt: |
      Using the visium_fluo_image_crop tissue image data, segment the individual cell
      nuclei visible in the image so that each nucleus is identified as a separate
      object, then report exactly how many distinct nuclei were detected as a whole
      number.
    answer: '25019'
  test:
    prompt: |
      Using the visium_hne_image_crop tissue image data, segment the individual cell
      nuclei visible in the image so that each nucleus is identified as a separate
      object, then report exactly how many distinct nuclei were detected as a whole
      number.
    answer: '120341'
- id: FreedomIntelligence-OpenClaw-Medical-Skills-skills-bio-spatial-transcriptomics-spatial-multiomics-ex__moran_spatial_gene
  train:
    prompt: |
      Using the slideseqv2 data, build a spatial neighbor graph over the beads and test
      which gene's expression is most strongly organized across space, i.e. it varies
      smoothly with position rather than fluctuating randomly from one neighboring bead to
      the next. Report only that gene's symbol.
    answer: Ttr
  test:
    prompt: |
      Using the slideseqv2 data, build a spatial neighbor graph over the beads and test how
      spatially structured each gene's expression is. Among the genes tested, find the one
      whose expression pattern is least organized in space, i.e. closest to varying randomly
      from one neighboring bead to the next rather than following any spatial trend. Report
      only that gene's symbol.
    answer: Irak2
- id: FreedomIntelligence-OpenClaw-Medical-Skills-skills-bio-spatial-transcriptomics-spatial-multiomics-ex__nhood_self_enrichment
  train:
    prompt: |
      Using the imc data, run a neighborhood enrichment analysis on the cell-type
      annotation to see which cell type most strongly prefers to be surrounded by cells of
      its own type in space, compared to what would be expected by chance. Report only the
      name of that cell type.
    answer: basal CK tumor cell
  test:
    prompt: |
      Using the imc data, run a neighborhood enrichment analysis on the cell-type
      annotation to see which cell type is least likely to be surrounded by cells of its own
      type in space, compared to what would be expected by chance (i.e. it shows the
      weakest self-clustering of all cell types tested). Report only the name of that cell
      type.
    answer: CK low HR low tumor cell
- id: FreedomIntelligence-OpenClaw-Medical-Skills-skills-bio-workflows-imc-pipeline-examples-imc_analysis__spatial_nhood_enrichment
  train:
    prompt: |
      Using the imc data, build a spatial graph of the cells and test whether
      pairs of cell types tend to sit next to each other in tissue more often
      than would happen by chance. Find the pair of two DIFFERENT cell types
      with the strongest evidence of preferring each other as spatial
      neighbors, and report both cell type names joined by "and" (order does
      not matter).
    answer: T cells and endothelial
  test:
    prompt: |
      Using the mibitof data, build a spatial graph of the cells and test
      whether pairs of cell type clusters tend to sit next to each other in
      tissue more often than would happen by chance. Find the pair of two
      DIFFERENT cell type clusters with the strongest evidence of preferring
      each other as spatial neighbors, and report both cluster names joined
      by "and" (order does not matter).
    answer: Myeloid_CD11c and Tcell_CD4
- id: FreedomIntelligence-OpenClaw-Medical-Skills-skills-bio-workflows-spatial-pipeline-examples-visium_wo__co_occurrence_mibitof
  train:
    prompt: |
      Using the mibitof imaging dataset, restrict to the point16 tissue sample, and compute
      how the annotated cell types spatially co-occur with each other across increasing
      distance. Looking only at the shortest distance range and ignoring a cell type
      co-occurring with itself, name the other cell type that most strongly co-occurs with
      CD8 T cells (Tcell_CD8) in their immediate spatial surroundings. Give just that other
      cell type's label.
    answer: Tcell_CD4
  test:
    prompt: |
      Using the mibitof imaging dataset, restrict to the point23 tissue sample, and compute
      how the annotated cell types spatially co-occur with each other across increasing
      distance. Looking only at the shortest distance range and ignoring a cell type
      co-occurring with itself, name the other cell type that most strongly co-occurs with
      CD8 T cells (Tcell_CD8) in their immediate spatial surroundings. Give just that other
      cell type's label.
    answer: Imm_other
- id: FreedomIntelligence-OpenClaw-Medical-Skills-skills-bio-workflows-spatial-pipeline-examples-visium_wo__nhood_enrichment_mibitof
  train:
    prompt: |
      Using the mibitof imaging dataset, restrict to the point16 tissue sample, build a
      spatial neighbor graph over the cells, and run a neighborhood enrichment analysis on
      the annotated cell types to find which two distinct cell types are most strongly
      enriched for being spatial neighbors of each other (i.e. they sit next to each other
      far more than chance would predict). Report the names of the two cell types.
    answer: Tcell_CD8 and Tcell_CD4
  test:
    prompt: |
      Using the mibitof imaging dataset, restrict to the point23 tissue sample, build a
      spatial neighbor graph over the cells, and run a neighborhood enrichment analysis on
      the annotated cell types to find which two distinct cell types are most strongly
      enriched for being spatial neighbors of each other (i.e. they sit next to each other
      far more than chance would predict). Report the names of the two cell types.
    answer: Endothelial and Imm_other
- id: FreedomIntelligence-OpenClaw-Medical-Skills-skills-spatial-transcriptomics-analysis-bioSkills-spatia__moran_top_gene
  train:
    prompt: |
      Using the slideseqv2 data, work out which gene's expression shows the strongest
      spatial autocorrelation across the tissue (i.e. it forms the clearest spatial
      pattern rather than being scattered randomly). Report only that gene's symbol.
    answer: Ttr
  test:
    prompt: |
      Using the seqfish data, work out which gene's expression shows the strongest
