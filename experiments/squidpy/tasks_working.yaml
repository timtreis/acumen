- id: NVIDIA-AI-Blueprints-single-cell-analysis-blueprint-notebooks-05_spatial_demo__cluster_co_occurrence_partner
  train:
    prompt: |
      Using the visium_hne spatial data and its existing per-spot cluster labels, compute how
