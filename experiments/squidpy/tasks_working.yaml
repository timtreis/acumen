      pattern rather than being scattered randomly). Report only that gene's symbol.
    answer: Hoxb9
- id: HaiqiChenLab-Slideseq_SSC_Niche-Post-RCTD-Analyses__co_occurrence_nearest_partner
  train:
    prompt: |
      Using the slideseqv2 data, keep only the beads assigned to these four cell
      types: CA1_CA2_CA3_Subiculum, DentatePyramids, Subiculum_Entorhinal_cl2, and
      Subiculum_Entorhinal_cl3. Compute, as a function of increasing spatial
      distance, the probability of finding each of these cell types near a bead of
      a given reference type. For the shortest distance range considered, report
      which of the three other types has the highest such probability of being
      found near a DentatePyramids bead. Give only that cell type's name.
    answer: Subiculum_Entorhinal_cl2
  test:
    prompt: |
      Using the slideseqv2 data, keep only the beads assigned to these seven cell
      types: Astrocytes, Oligodendrocytes, Polydendrocytes, Microglia,
      Endothelial_Stalk, Endothelial_Tip, and Mural. Compute, as a function of
      increasing spatial distance, the probability of finding each of these cell
      types near a bead of a given reference type. For the shortest distance range
      considered, report which of the other six types has the highest such
      probability of being found near a Microglia bead. Give only that cell type's
      name.
    answer: Astrocytes
- id: HaiqiChenLab-Slideseq_SSC_Niche-Post-RCTD-Analyses__nhood_enrichment_partner
  train:
    prompt: |
      Using the slideseqv2 data, keep only the beads assigned to these four cell
      types: CA1_CA2_CA3_Subiculum, DentatePyramids, Subiculum_Entorhinal_cl2, and
      Subiculum_Entorhinal_cl3. Build a spatial neighbor graph over these cells and
      test, for every pair of these cell types, whether they turn up next to each
      other more or less often than chance would predict. Among the three other
      types in the list, report which one is the most enriched spatial neighbor of
      the CA1_CA2_CA3_Subiculum cells. Give only that cell type's name.
    answer: Subiculum_Entorhinal_cl3
  test:
    prompt: |
      Using the slideseqv2 data, keep only the beads assigned to these seven cell
      types: Astrocytes, Oligodendrocytes, Polydendrocytes, Microglia,
      Endothelial_Stalk, Endothelial_Tip, and Mural. Build a spatial neighbor graph
      over these cells and test, for every pair of these cell types, whether they
      turn up next to each other more or less often than chance would predict.
      Among the other six types in the list, report which one is the most enriched
      spatial neighbor of the Endothelial_Tip cells. Give only that cell type's
      name.
    answer: Endothelial_Stalk
- id: Harshavardhan-BV-PHCCO-SpatialTranscriptomics-Spatial_HandsOn__moran_top_gene
  train:
    prompt: |
