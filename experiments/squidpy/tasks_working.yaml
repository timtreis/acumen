- id: NBISweden-workshop-spatial-labs-03_1_segmentation_free_supervised__nhood_enrichment_top_pair
  train:
    prompt: |
      Using the imc data, which annotated cell type is most strongly co-localized
      with T cells, i.e. which other cell type shows the strongest spatial
      neighborhood enrichment with T cells across the tissue? Give only the name
