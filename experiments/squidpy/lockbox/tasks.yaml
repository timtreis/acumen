- id: JakobElkholtei-retinoblastoma-notebooks-01_exploration__spatial_neighbor_edges
  train:
    prompt: |
      Using the visium_hne_adata spatial transcriptomics dataset (a Visium-profiled
      mouse brain section, H&E stained), connect each tissue spot to its physically
      closest neighboring spots on the slide to form a spatial neighbor graph. Report
      the total number of neighbor connections (edges) present in the resulting graph.
    answer: '15580'
  test:
    prompt: |
      Using the visium_fluo_adata spatial transcriptomics dataset (a Visium-profiled
