tasks:
- id: BinXBioLab-Data_Science_Capstone_Fall_2022-tangram-scripts-Tangram_BX__nuclei_max_spot
  train:
    prompt: |
      Using the fluorescent brain tissue crop that ships with the package, along with its
      matching spatial gene expression data, segment the cell nuclei visible in the image
      and figure out how many nuclei fall within each spatial spot's tissue region. Report
      the barcode of the spot that contains the most nuclei.
    answer: AACTGGGTCCCGACGT-1
  test:
    prompt: |
      Using the fluorescent brain tissue crop that ships with the package, segment the cell
      nuclei visible in the image and count how many nuclei are detected across the entire
      cropped tissue image as a whole (not restricted to any single spot). Report the total
      nucleus count.
    answer: '27468'
- id: FreedomIntelligence-OpenClaw-Medical-Skills-skills-bio-workflows-spatial-pipeline-examples-visium_wo__svg_marker_mibitof
  train:
    prompt: |
      Using the mibitof imaging dataset, restrict to the point16 tissue sample, build a
      spatial neighbor graph over the cells, and test every measured protein marker for
      spatial autocorrelation to find which single marker shows the strongest tendency to
      form spatial clusters across the tissue rather than being randomly distributed. Report
      just that marker's name.
    answer: CK
  test:
    prompt: |
      Using the mibitof imaging dataset, restrict to the point8 tissue sample, build a
      spatial neighbor graph over the cells, and test every measured protein marker for
      spatial autocorrelation to find which single marker shows the strongest tendency to
      form spatial clusters across the tissue rather than being randomly distributed. Report
      just that marker's name.
    answer: CD45
- id: FreedomIntelligence-OpenClaw-Medical-Skills-skills-spatial-transcriptomics-analysis-bioSkills-spatia__nhood_self_enrichment
  train:
    prompt: |
      Using the mibitof data, determine which annotated cell type shows the strongest
      tendency to be spatially surrounded by neighbors of its own type, rather than by
      other cell types. Report only the name of that cell type exactly as it is
      labeled in the data.
    answer: Epithelial
  test:
    prompt: |
      Using the imc data, determine which annotated cell type shows the strongest
      tendency to be spatially surrounded by neighbors of its own type, rather than by
      other cell types. Report only the name of that cell type exactly as it is
      labeled in the data.
    answer: basal CK tumor cell
- id: HuangLab-PKU-PRISM-Analysis-HCC3Dpseudo-nhood_enrichment__nhood_most_segregated
  train:
    prompt: |
      Using the imc dataset, determine which two cell types most strongly avoid each other
      spatially in the tissue — the pair that ends up next to each other far less often than
      random chance would predict. Report the two cell type names, in any order.
    answer: apoptotic tumor cell, macrophages
  test:
    prompt: |
      Using the merfish dataset, determine which two cell classes most strongly avoid each
      other spatially in the tissue — the pair that ends up next to each other far less often
      than random chance would predict. Report the two cell class names, in any order.
    answer: Inhibitory, OD Mature 2
- id: HuangLab-PKU-PRISM-Analysis-HCC3Dpseudo-nhood_enrichment__nhood_top_enriched
  train:
    prompt: |
